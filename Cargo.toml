[package]
name = "rusty-conduit-ssh"
version = "2.0.0"
edition = "2021"
description = "Single-binary HTTP/HTTPS and SOCKS4/4a/5 forward proxy that routes all upstream traffic and DNS through an auto-reconnecting SSH dynamic tunnel"
license = "BSD-3-Clause"

[lib]
name = "rusty_conduit_ssh"
path = "src/lib.rs"

[[bin]]
name = "rusty-conduit-ssh"
path = "src/main.rs"

[dependencies]
# Shared proxy engine: listeners, mux, HTTP/HTTPS, SOCKS4/4a/5, MITM, filter, logging,
# routing, and upstream dialers. `default-features = false`: rusty-conduit-ssh has no
# routing rules, so the regex-based rule matcher (`routing` feature) is not needed.
rusty-conduit-engine = { git = "https://github.com/jpbaking/rusty-conduit-engine", tag = "v0.4.1", default-features = false }

# Async runtime & utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs", "io-std", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }

# CLI & configuration
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
humantime = "2"

# Errors
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rlimit = "0.12"
libc = "0.2"

[dev-dependencies]
# Test fixtures (origin servers, MITM/TLS clients, CA generation). The engine owns the
# runtime HTTP/TLS stack; these stay pure-Rust (`ring` provider, no OpenSSL / aws-lc).
bytes = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = "0.18"
time = { version = "0.3", features = ["formatting", "macros"] }
